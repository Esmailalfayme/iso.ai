async function chatCall(messages,o){

  var body={model:o.model||txtModel(),messages:messages,stream:!!o.onDelta};if(o.temperature!=null)body.temperature=o.temperature;
  var res,opts={method:'POST',headers:hdrs(true),body:JSON.stringify(body),signal:o.signal};
  try{res=o.onDelta?await fetch(base+'/chat/completions',opts):await fetchT(base+'/chat/completions',opts,o.timeout||90000);}catch(e){throw netErr(e);}
  if(!res.ok)throw httpErr(res,await res.text().catch(function(){return '';}));

    var j=await res.json(),c=j.choices&&j.choices[0],t=(c&&c.message&&typeof c.message.content==='string')?c.message.content:'';

    if(r.done)break;
    buf+=dec.decode(r.value,{stream:true});var p=parseSSE(buf);buf=p.rest;
    if(p.err)throw new Error(p.err);
    if(p.deltas.length){full+=p.deltas.join('');o.onDelta(full);}
    if(p.done)break;
  }

  return full;
}

function detectRoute(text,att){
  var t=normAr(String(text||'')).toLowerCase(),head=t.slice(0,160);

  if(att)return null;

  if(extractUrls(text).length||/(ابحث|دور علي|بحث عن|ابحث عن|search for|look up|google |اخر اخبار|latest news|ما اخر)/.test(head))return 'web';
  if(/(لخص|تلخيص|اختصر|summari[sz]e|tl;?dr)/.test(head))return 'summarize';
  if(/(اعد صياغه|اعد كتابه|صياغه اخري|reword|paraphrase|rephrase|rewrite)/.test(head))return 'rewrite';
  if(/(صحح|دقق|تدقيق|اخطاء|proofread|grammar|spell)/.test(head))return 'proofread';
  if(/(اكتب لي|اكتب رساله|اكتب ايميل|اكتب بريد|اكتب منشور|اكتب مقال|اكتب خطاب|write (me )?(an? )?(email|post|letter|message|essay|article|cover letter)|draft (an? )?(email|post|letter))/.test(head))return 'writer';
  if(/(افكار|فكره|اقترح|brainstorm|ideas for|suggest )/.test(head))return 'ideas';
  if(/```/.test(t)||/(كود|برمج|بايثون|جافا|سكربت|دالة|function |python|javascript|java |c\+\+|html|css|sql|react|bug|stack trace|error:|algorithm|خوارزم|regex)/.test(head))return 'code';

  return null;
}

function dlImage(m){var ext=m.blob?(m.blob.type.split('/')[1]||'png').replace('jpeg','jpg'):'jpg',name='iso1-'+(m.id||uid())+'.'+ext;if(m.blob)download(name,m.blob);else if(m.gen&&m.gen.thumb)download(name,dataURLToBlob(m.gen.thumb));else if(m.gen&&m.gen.url)window.open(m.gen.url,'_blank');}
function buildContext(c,upto,hint){
  var hist=[],lastImg=-1,i,m;
  for(i=0;i<c.msgs.length;i++){if(c.msgs[i]===upto)break;if(c.msgs[i].role==='user'&&c.msgs[i].imgFull)lastImg=i;}
  for(i=0;i<c.msgs.length;i++){m=c.msgs[i];if(m===upto)break;if(m.err)continue;
    if(m.role==='user'){if(i===lastImg)hist.push({role:'user',content:[{type:'text',text:m.content||'صف هذه الصورة'},{type:'image_url',image_url:{url:m.imgFull}}]});else hist.push({role:'user',content:(m.content||'')+(m.img?'\n[أرفق المستخدم صورة]':'')});}
    else if(m.gen)hist.push({role:'assistant',content:'[أنشأتُ صورة بهذا الوصف: '+m.gen.prompt+']'});
    else if(m.content)hist.push({role:'assistant',content:m.content});}
  hist=hist.slice(-24);while(hist.length&&hist[0].role!=='user')hist.shift();
  var total=0,out=[];for(var j=hist.length-1;j>=0;j--){total+=typeof hist[j].content==='string'?hist[j].content.length:500;if(total>24000&&out.length)break;out.unshift(hist[j]);}
  return[{role:'system',content:sysPrompt(hint)}].concat(out);
}
async function submit(text){
  if(UI.busy)return;text=(text||'').trim();var att=UI.attach;if(!text&&!att)return;
  var c=curChat();if(!c){c={id:uid(),title:'محادثة جديدة',ts:Date.now(),msgs:[]};chats.unshift(c);curId=c.id;}
  var sl=parseSlash(text),mode=null,route=null;
  if(sl){mode=sl.mode;text=sl.text;}else if(UI.imgMode)mode='image';else if(UI.webMode)mode='web';else{route=detectRoute(text,att);if(route==='image'||route==='edit'||route==='web')mode=route;}
  if(mode&&!route)route=mode;

async function runAssistant(c,mode,text,route){
  var am={id:uid(),role:'assistant',content:'',live:true,mode:mode,route:route||null,kind:(mode==='image'||mode==='edit')?'image':null,status:mode==='web'?'جارٍ البحث…':''};
  c.msgs.push(am);saveChats();renderMsgs();renderHistory();
  UI.busy=true;UI.ctrl=new AbortController();setSendState();var sig=UI.ctrl.signal;
  try{
    if(mode==='image'||mode==='edit'){
      var lu=c.msgs[c.msgs.length-2],src=mode==='edit'&&lu&&lu.imgFull?lu.imgFull:null;
      var r=await makeImage({prompt:text,src:src,editModel:src?'black-forest-labs/flux.1-kontext-pro':null,enhance:src?false:S.enhance,ratio:'1:1',signal:sig,onStatus:function(s){am.status=s;paintMsg(am);}});
      am.gen={prompt:r.prompt,ratio:r.ratio,thumb:r.thumb||null,url:r.blob?null:r.url};am.objUrl=r.objUrl;am.blob=r.blob;
      if(r.thumb){gallery.unshift({id:am.id,prompt:r.prompt,ratio:r.ratio,thumb:r.thumb,ts:Date.now()});saveGallery();}
    }else if(mode==='web'){
      var res=await runResearch({query:text,depth:'fast',signal:sig,urls:extractUrls(text),onStep:function(s){am.status={plan:'تخطيط البحث…',collect:'جارٍ جمع المصادر…',write:'جارٍ كتابة الإجابة…'}[s];paintMsg(am);},onDelta:function(full){am.status='';am.content=full;scheduleMsgPaint(am);}});
      am.content=res.text;am.sources=res.sources;
    }else{
      await chatCall(buildContext(c,am,route&&ROUTES[route]?ROUTES[route].hint:''),{temperature:S.temp,signal:sig,onDelta:function(full){am.status='';am.content=full;scheduleMsgPaint(am);}});
    }
  }catch(e){
    if(e.name==='AbortError'){if(!am.content&&!am.gen)am.content='(تم الإيقاف)';}
    else{am.err=e.message||'حدث خطأ غير متوقع.';am.errStatus=e.status;am.errNet=!!e.net;}
  }
  am.live=false;am.status='';UI.busy=false;UI.ctrl=null;saveChats();
  if(UI.view==='chat'){renderMsgs();setSendState();}renderHistory();
}
function regen(){
  if(UI.busy)return;var c=curChat();if(!c)return;var last=c.msgs[c.msgs.length-1];if(!last||last.role!=='assistant')return;
  c.msgs.pop();var lu=c.msgs[c.msgs.length-1];if(!lu||lu.role!=='user'){renderMsgs();return;}

}

  '<div class="field"><label for="sTp">الإبداع في الردود: <span id="sTpV"></span></label><input id="sTp" type="range" min="0" max="1.2" step="0.1"></div><div class="field"><label for="sPs">تعليمات إضافية دائمة</label><textarea class="textarea" id="sPs" rows="3" placeholder="مثال: خاطبني بلهجة مصرية وكن مختصراً"></textarea></div>'+
  '<h3 class="sec">البيانات</h3><p class="hint">كل شيء يُحفظ في متصفحك فقط. تُرسل رسائلك إلى المزوّد الذي تختاره لتوليد الردود.</p><div class="row"><button class="btn sm" id="sExp" type="button">تصدير المحادثات</button><label class="btn sm" for="sImp">استيراد</label><input type="file" id="sImp" accept="application/json" hidden><button class="btn sm danger" id="sClr" type="button">مسح كل البيانات</button></div>';
  var set=function(id,k,num){var e=$(id);e.addEventListener('input',function(){S[k]=num?+e.value:e.value.trim();saveS();});};
  $('#sKey').value=S.key;set('#sKey','key');$('#sBase').value=S.base;set('#sBase','base');$('#sModel').value=S.model;set('#sModel','model');
  $('#sIp').value=S.imgProvider;$('#sIp').addEventListener('change',function(){S.imgProvider=this.value;saveS();});
  $('#sIk').value=S.imgKey;set('#sIk','imgKey');$('#sIm').value=S.imgModel;set('#sIm','imgModel');
  $('#sEn').checked=!!S.enhance;$('#sEn').addEventListener('change',function(){S.enhance=this.checked;IM.enhance=this.checked;saveS();});
  $('#sTv').value=S.tavily;set('#sTv','tavily');$('#sSm').value=S.searchModel;set('#sSm','searchModel');
  $('#sNm').value=S.name;set('#sNm','name');$('#sPs').value=S.persona;$('#sPs').addEventListener('input',function(){S.persona=this.value;saveS();});
  $('#sLg').value=S.lang;$('#sLg').addEventListener('change',function(){S.lang=this.value;saveS();});
  $('#sTh').value=S.theme;$('#sTh').addEventListener('change',function(){S.theme=this.value;saveS();applyTheme();});
  $('#sDl').value=S.dictLang;$('#sDl').addEventListener('change',function(){S.dictLang=this.value;saveS();});
  $('#sTp').value=S.temp;$('#sTpV').textContent=S.temp;$('#sTp').addEventListener('input',function(){S.temp=+this.value;$('#sTpV').textContent=S.temp;saveS();});
  function hint(){var p=pv();$('#sHint').innerHTML=esc(p.hint||'')+(p.link?' <a href="'+p.link+'" target="_blank" rel="noopener">احصل على مفتاح</a>':'');$('#sBase').placeholder=p.base||'https://…/v1';$('#sModel').placeholder=p.model||'اسم النموذج';}
  hint();
  $('#sPv').addEventListener('change',function(){S.provider=this.value;S.base='';S.model='';$('#sBase').value='';$('#sModel').value='';saveS();hint();});
  $('#sList').addEventListener('click',async function(){$('#sStat').textContent='جارٍ الجلب…';try{var l=await listModels('text');$('#dlTxt').innerHTML=l.map(function(x){return'<option value="'+esc(x)+'">';}).join('');$('#sStat').textContent='تم جلب '+l.length+' نموذج. اختر من القائمة بالنقر على خانة الاسم.';}catch(e){$('#sStat').textContent=e.message;}});
  $('#sTest').addEventListener('click',async function(){$('#sStat').textContent='جارٍ الاختبار…';try{var t=await chatCall([{role:'user',content:'Reply with the single word: ok'}],{temperature:0,timeout:30000});$('#sStat').textContent='نجح الاتصال. ردّ النموذج: '+String(t).slice(0,60);}catch(e){$('#sStat').textContent=e.message;}});
  $('#sExp').addEventListener('click',function(){download('iso1-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({v:1,chats:chats.map(function(c){return{id:c.id,title:c.title,ts:c.ts,msgs:c.msgs.map(stripMsg)};}),gallery:gallery}),'application/json');});
  $('#sImp').addEventListener('change',function(){var f=this.files&&this.files[0];if(!f)return;var fr=new FileReader();fr.onload=function(){try{var d=JSON.parse(fr.result),ids={};chats.forEach(function(c){ids[c.id]=1;});(d.chats||[]).forEach(function(c){if(c&&c.id&&!ids[c.id])chats.push(c);});chats.sort(function(a,b){return b.ts-a.ts;});saveChats();toast('تم الاستيراد');renderHistory();}catch(e){toast('ملف غير صالح');}};fr.readAsText(f);});
  var clr=$('#sClr'),armed=false;clr.addEventListener('click',function(){if(!armed){armed=true;clr.textContent='اضغط مرة أخرى للتأكيد';return;}['iso1.s','iso1.chats','iso1.cur','iso1.gallery','iso1.view'].forEach(LS.del);location.reload();});
  $('#sClose').addEventListener('click',closeSettings);
  m.hidden=false;
}
function closeSettings(){$('#modal').hidden=true;$('#sheet').setAttribute('aria-label','الإعدادات');applyTheme();if(UI.view==='chat')renderMsgs();}

/* ---------- init ---------- */
function init(){
  applyTheme();fitViewport();
  if(window.visualViewport){visualViewport.addEventListener('resize',fitViewport);visualViewport.addEventListener('scroll',fitViewport);}
  window.addEventListener('resize',fitViewport);
  $('#logoTop').innerHTML=logoSvg(30);freshChat();renderNav();
  $('#scrim').addEventListener('click',closePop);
  $('#menuBtn').addEventListener('click',openDrawer);$('#sideClose').addEventListener('click',closePop);
  $('#topNew').addEventListener('click',newChatClick);$('#clrAll').addEventListener('click',clearAll);
  $('#modal').addEventListener('click',function(e){if(e.target===this)closeSettings();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(!$('#modal').hidden)closeSettings();else closeDrawer();}});
  go('chat');
}
/* ---------- account + cloud sync (Supabase Auth, RLS per user) ---------- */
var SB=null,USER=null,synced={},pushT=null,pulling=false;
var SB_KEY='sb_publishable_OmpN560vj1JHDCzxxaHMLA_zGlnblnD';
var AUTH_PROVIDERS={github:true,google:false};
try{if(window.supabase&&PUB)SB=window.supabase.createClient(PUB.url,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});}catch(e){SB=null;}
function cloudForm(c){return{id:c.id,title:c.title||'',ts:c.ts||0,data:{msgs:c.msgs.map(function(m){var o=stripMsg(m);delete o.img;delete o.imgFull;if(o.gen){o.gen=JSON.parse(JSON.stringify(o.gen));o.gen.thumb=null;}return o;})}};}
function cloudPushSoon(){if(!SB||!USER||pulling)return;clearTimeout(pushT);pushT=setTimeout(cloudPush,1200);}
function cloudPush(){
  if(!SB||!USER||pulling)return;
  var rows=[],keep={};
  chats.forEach(function(c){if(!c.msgs.length)return;var r=cloudForm(c);var k=JSON.stringify(r);keep[c.id]=1;if(synced[c.id]!==k){r.user_id=USER.id;rows.push([r,k]);}});
  var gone=Object.keys(synced).filter(function(id){return !keep[id];});
  if(rows.length)SB.from('chats').upsert(rows.map(function(x){return x[0];}),{onConflict:'user_id,id'}).then(function(res){if(!res.error)rows.forEach(function(x){synced[x[0].id]=x[1];});else toast('تعذّرت المزامنة');});
  if(gone.length)SB.from('chats').delete().in('id',gone).then(function(res){if(!res.error)gone.forEach(function(id){delete synced[id];});});
}
function cloudPull(){
  if(!SB||!USER)return Promise.resolve();
  pulling=true;
  return SB.from('chats').select('id,title,ts,data').order('ts',{ascending:false}).limit(200).then(function(res){
    if(res.error){pulling=false;toast('تعذّر تحميل محادثاتك');return;}
    var byId={};chats.forEach(function(c){byId[c.id]=c;});
    (res.data||[]).forEach(function(r){
      var rc={id:r.id,title:r.title||'محادثة',ts:+r.ts||0,msgs:(r.data&&r.data.msgs)||[]};
      synced[r.id]=JSON.stringify(cloudForm(rc));
      var lc=byId[r.id];
      if(!lc)chats.push(rc);else if(rc.ts>(lc.ts||0)){var i=chats.indexOf(lc);chats[i]=rc;}
    });
    var empty=chats.filter(function(c){return !c.msgs.length;}),full=chats.filter(function(c){return c.msgs.length;});
    full.sort(function(a,b){return(b.ts||0)-(a.ts||0);});
    chats=empty.slice(0,1).concat(full);
    pulling=false;
    LS.set('iso1.chats',chats.filter(function(c){return c.msgs.length;}).slice(0,60).map(function(c){return{id:c.id,title:c.title,ts:c.ts,msgs:c.msgs.map(stripMsg)};}));
    renderHistory();cloudPush();
  });
}
function setUser(u){
  var was=USER&&USER.id;USER=u||null;
  if(USER&&USER.id!==was)cloudPull().then(function(){if(UI.view==='chat'&&!UI.busy)renderHistory();});
  renderNav();
}
function signOut(){
  if(!SB)return;
  SB.auth.signOut().then(function(){USER=null;synced={};chats=[];LS.del('iso1.chats');LS.del('iso1.cur');freshChat();go('chat');renderNav();toast('تم تسجيل الخروج');});
}
function authErr(e){
  var m=(e&&e.message||'').toLowerCase();
  if(m.indexOf('invalid login')>=0)return 'البريد أو كلمة المرور غير صحيحة';
  if(m.indexOf('already registered')>=0||m.indexOf('already been')>=0)return 'هذا البريد مسجّل مسبقاً، جرّب تسجيل الدخول';
  if(m.indexOf('password')>=0&&m.indexOf('6')>=0)return 'كلمة المرور قصيرة (٦ أحرف على الأقل)';
  if(m.indexOf('valid email')>=0||m.indexOf('invalid email')>=0)return 'البريد الإلكتروني غير صالح';
  if(m.indexOf('rate')>=0)return 'محاولات كثيرة، انتظر قليلاً';
  return 'تعذّر الأمر، حاول مرة أخرى';
}
function openAuth(mode){
  mode=mode||'in';
  var m=$('#modal'),sh=$('#sheet');
  sh.setAttribute('aria-label','الحساب');
  var oauth='';
  if(AUTH_PROVIDERS.google)oauth+='<button class="btn oa" type="button" data-p="google">'+'<b>G</b> المتابعة مع Google</button>';
  if(AUTH_PROVIDERS.github)oauth+='<button class="btn oa" type="button" data-p="github">'+'<b>⌥</b> المتابعة مع GitHub</button>';
  sh.innerHTML='<div class="sh-h"><h2>'+(mode==='in'?'تسجيل الدخول':'إنشاء حساب')+'</h2><button class="ib" id="aClose" type="button" aria-label="إغلاق">'+ico('x')+'</button></div>'+
  '<p class="hint">سجّل لتُحفظ محادثاتك في حسابك وتظهر على كل أجهزتك. يمكنك الاستمرار كضيف دائماً.</p>'+
  '<div class="oa-wrap">'+oauth+'</div><div class="or"><span>أو بالبريد</span></div>'+
  '<form id="aForm" novalidate><div class="field"><label for="aMail">البريد الإلكتروني</label><input class="input" id="aMail" type="email" autocomplete="email" dir="ltr" required></div>'+
  '<div class="field"><label for="aPw">كلمة المرور</label><input class="input" id="aPw" type="password" autocomplete="'+(mode==='in'?'current-password':'new-password')+'" dir="ltr" minlength="6" required></div>'+
  '<p class="hint" id="aMsg" role="alert" style="color:var(--danger,#c0392b)"></p>'+
  '<button class="btn pri" id="aGo" type="submit" style="width:100%">'+(mode==='in'?'دخول':'إنشاء الحساب')+'</button></form>'+
  '<p class="hint" style="text-align:center;margin-top:12px"><button type="button" class="linkb" id="aSw">'+(mode==='in'?'ليس لديك حساب؟ أنشئ حساباً':'لديك حساب؟ سجّل الدخول')+'</button></p>';
  m.hidden=false;
  $('#aClose').addEventListener('click',closeSettings);
  $('#aSw').addEventListener('click',function(){openAuth(mode==='in'?'up':'in');});
  $$('.oa').forEach(function(b){b.addEventListener('click',function(){
    SB.auth.signInWithOAuth({provider:b.getAttribute('data-p'),options:{redirectTo:location.origin+location.pathname}}).then(function(r){if(r.error)$('#aMsg').textContent=authErr(r.error);});});});
  $('#aForm').addEventListener('submit',function(e){
    e.preventDefault();var em=$('#aMail').value.trim(),pw=$('#aPw').value,go=$('#aGo'),msg=$('#aMsg');msg.textContent='';
    if(!em||!pw){msg.textContent='أدخل البريد وكلمة المرور';return;}
    go.disabled=true;
    var p=mode==='in'?SB.auth.signInWithPassword({email:em,password:pw}):SB.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});
    p.then(function(r){go.disabled=false;
      if(r.error){msg.textContent=authErr(r.error);return;}
      if(!r.data.session){msg.textContent=mode==='up'?'تم إنشاء الحساب. إن طُلب تأكيد البريد فتحقق من صندوقك ثم سجّل الدخول.':'تعذّر الدخول';return;}
      setUser(r.data.session.user);closeSettings();toast(mode==='in'?'مرحباً بعودتك':'تم إنشاء حسابك');
    }).catch(function(){go.disabled=false;msg.textContent='تعذّر الاتصال';});
  });
  setTimeout(function(){var i=$('#aMail');if(i&&!COARSE)i.focus();},50);
}
function accountBtn(){
  if(!SB)return null;
  if(USER){var nm=(USER.user_metadata&&(USER.user_metadata.user_name||USER.user_metadata.name))||USER.email||'حسابي';
    var b=nbtn('user',nm,function(){if(confirm('تسجيل الخروج من '+(USER.email||nm)+'؟'))signOut();});b.title=USER.email||'';b.classList.add('acct');return b;}
  var b2=nbtn('user','تسجيل الدخول',function(){openAuth('in');});b2.classList.add('acct');return b2;
}
if(SB){SB.auth.onAuthStateChange(function(ev,s){if(ev==='SIGNED_OUT'&&!s){USER=null;return;}if(s&&s.user&&(!USER||USER.id!==s.user.id))setTimeout(function(){setUser(s.user);},0);});
  SB.auth.getSession().then(function(r){if(r.data&&r.data.session)setUser(r.data.session.user);});}

init();

})();
</script>
